global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    monitor: takehome

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The Python harness (the subject under test). Scraped at 2s because load stages
  # are short and a 15s interval would alias the interesting transitions.
  - job_name: llm-harness
    scrape_interval: 2s
    static_configs:
      - targets: ["host.docker.internal:9464"]
        labels:
          harness: python
